<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Road Dodge Kids</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111827}body{touch-action:none}
#gameWrap{position:relative;width:100vw;height:100vh;max-width:520px;margin:0 auto;overflow:hidden;background:linear-gradient(#cfeeff 0 18%,#78b85a 18% 100%)}
#hud{position:absolute;z-index:20;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px}.badge{background:#ffffffee;border-radius:16px;padding:9px 12px;font-weight:900;box-shadow:0 6px 18px #0002;font-size:14px}
#road{position:absolute;left:50%;transform:translateX(-50%);top:18%;bottom:0;width:78%;background:#3f4650;border-left:10px solid #d1d5db;border-right:10px solid #d1d5db;overflow:hidden}#road:before,#road:after{content:"";position:absolute;top:0;bottom:0;width:4px;background:#ffffff22}#road:before{left:33.33%}#road:after{left:66.66%}.laneDash{position:absolute;width:7px;height:54px;background:white;border-radius:4px;opacity:.9}
#car{position:absolute;z-index:10;bottom:100px;left:50%;transform:translateX(-50%);width:96px;height:154px;transition:left .11s ease-out}.carBody{position:absolute;inset:0;border-radius:30px 30px 22px 22px;background:#050505;border:3px solid #262626;box-shadow:0 8px 16px #0007}.windshield{position:absolute;left:16px;right:16px;top:24px;height:42px;border-radius:16px;background:linear-gradient(#9bdaf4,#2f586b);border:2px solid #444}.rearGlass{position:absolute;left:18px;right:18px;bottom:24px;height:30px;border-radius:12px;background:#244554;border:2px solid #444}.grille{position:absolute;left:21px;right:21px;bottom:8px;height:12px;border-radius:8px;background:#222;border:2px solid #555}.light{position:absolute;width:18px;height:10px;background:#fff7bb;border-radius:8px;bottom:10px}.light.l{left:8px}.light.r{right:8px}.wheel{position:absolute;width:12px;height:33px;background:#111;border-radius:8px}.w1{left:-7px;top:30px}.w2{right:-7px;top:30px}.w3{left:-7px;bottom:24px}.w4{right:-7px;bottom:24px}.kia{position:absolute;left:50%;top:76px;transform:translateX(-50%);color:#ddd;font-weight:900;font-size:13px;letter-spacing:1px}.model{position:absolute;left:50%;top:92px;transform:translateX(-50%);color:#999;font-weight:800;font-size:9px}
.obstacle{position:absolute;z-index:8;width:86px;height:112px;display:flex;align-items:flex-end;justify-content:center}.charCard{width:82px;height:98px;border-radius:24px;background:#fff;box-shadow:0 7px 14px #0004;border:3px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:42px}.charLabel{font-size:10px;font-weight:900;margin-top:2px;color:#111827;text-align:center;line-height:1.05}.maskBlue{background:#dbeafe}.maskRed{background:#fee2e2}.maskGreen{background:#dcfce7}.beanish{background:#fef3c7}.catmouse{background:#f3e8ff}
#controls{
  position:absolute;
  z-index:30;
  top:50%;
  left:0;
  right:0;
  transform:translateY(-50%);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 10px;
  pointer-events:none
}
.ctrl{
  pointer-events:auto;
  width:86px;
  height:110px;
  border:0;
  border-radius:28px;
  background:#ffffffee;
  box-shadow:0 10px 28px #0005;
  font-size:42px;
  font-weight:900;
  color:#111827;
  touch-action:manipulation;
  display:flex;
  align-items:center;
  justify-content:center
}
.ctrl:active{
  transform:scale(.95);
  background:#dbeafe
}
#overlay{position:absolute;z-index:40;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:22px}#card{width:min(92%,390px);background:white;border-radius:28px;padding:24px;text-align:center;box-shadow:0 20px 50px #0006}#card h1{margin:0 0 8px;font-size:28px}#card p{margin:8px 0 18px;color:#475569;font-weight:700}.bigBtn{border:0;border-radius:20px;padding:16px 22px;background:#2563eb;color:white;font-size:21px;font-weight:900;width:100%}.smallText{font-size:12px;color:#64748b;margin-top:12px}#flash{position:absolute;z-index:35;inset:0;background:#fff0;pointer-events:none}
</style>
</head>
<body>
<div id="gameWrap">
  <div id="hud"><div class="badge">⭐ Score: <span id="score">0</span></div><div class="badge">❤️ <span id="lives">3</span></div></div>
  <div id="road"></div>
  <div id="car" aria-label="Kia Sorento noire"><div class="carBody"><div class="windshield"></div><div class="rearGlass"></div><div class="grille"></div><div class="light l"></div><div class="light r"></div><div class="wheel w1"></div><div class="wheel w2"></div><div class="wheel w3"></div><div class="wheel w4"></div><div class="kia">KIA</div><div class="model">SORENTO</div></div></div>
  <div id="controls"><button class="ctrl" id="leftBtn" aria-label="Gauche">⬅️</button><button class="ctrl" id="rightBtn" aria-label="Droite">➡️</button></div>
  <div id="flash"></div>
  <div id="overlay"><div id="card"><h1>🚙 Road Dodge</h1><p>Conduis la Kia Sorento noire et évite les personnages.</p><button class="bigBtn" id="startBtn">▶️ Jouer</button><div class="smallText">Personnages originaux inspirés de héros masqués, d’un monsieur maladroit et d’un duo chat-souris.</div></div></div>
</div>
<script>
const wrap=document.getElementById('gameWrap'),road=document.getElementById('road'),car=document.getElementById('car'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),overlay=document.getElementById('overlay'),card=document.getElementById('card'),startBtn=document.getElementById('startBtn'),flash=document.getElementById('flash');
const laneCount=3;let lane=1,score=0,lives=3,running=false,lastSpawn=0,spawnEvery=1050,speed=4.2,obstacles=[],dashes=[],raf=null;
const chars=[{emoji:'🦉',label:'Night Owl',cls:'maskBlue'},{emoji:'🐱',label:'Red Mask',cls:'maskRed'},{emoji:'🦎',label:'Green Hero',cls:'maskGreen'},{emoji:'🧑🏻‍💼',label:'Mr. Bumbles',cls:'beanish'},{emoji:'🐱🐭',label:'Cat & Mouse',cls:'catmouse'}];
function laneLeft(i){const rr=road.getBoundingClientRect(),wr=wrap.getBoundingClientRect(),w=rr.width/laneCount;return rr.left-wr.left+w*(i+.5)-48}function updateCar(){car.style.left=laneLeft(lane)+'px';car.style.transform='none'}function moveLeft(){if(running){lane=Math.max(0,lane-1);updateCar()}}function moveRight(){if(running){lane=Math.min(2,lane+1);updateCar()}}
document.getElementById('leftBtn').addEventListener('pointerdown',moveLeft);document.getElementById('rightBtn').addEventListener('pointerdown',moveRight);window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')moveLeft();if(e.key==='ArrowRight')moveRight()});
function makeDashes(){road.querySelectorAll('.laneDash').forEach(x=>x.remove());dashes=[];for(let l=1;l<3;l++)for(let y=-40;y<innerHeight;y+=100){const d=document.createElement('div');d.className='laneDash';d.style.left=`calc(${l/3*100}% - 3px)`;d.style.top=y+'px';road.appendChild(d);dashes.push({el:d,y})}}
function animateDashes(){const h=road.clientHeight;for(const d of dashes){d.y+=speed*1.4;if(d.y>h)d.y=-60;d.el.style.top=d.y+'px'}}
function spawnObstacle(){const o=document.createElement('div');o.className='obstacle';const c=chars[Math.floor(Math.random()*chars.length)];o.innerHTML=`<div class="charCard ${c.cls}"><div>${c.emoji}</div><div class="charLabel">${c.label}</div></div>`;road.appendChild(o);const i=Math.floor(Math.random()*3),w=road.clientWidth/3;o.style.left=(w*(i+.5)-43)+'px';o.style.top='-120px';obstacles.push({el:o,y:-120,hit:false})}
function overlap(a,b){return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom)}function hitEffect(){flash.style.transition='none';flash.style.background='#ef444488';requestAnimationFrame(()=>{flash.style.transition='background .35s ease';flash.style.background='#fff0'});if(navigator.vibrate)navigator.vibrate(80)}
function updateObstacles(){const bottom=road.clientHeight,cr=car.getBoundingClientRect();for(let i=obstacles.length-1;i>=0;i--){const ob=obstacles[i];ob.y+=speed;ob.el.style.top=ob.y+'px';const r=ob.el.getBoundingClientRect();if(!ob.hit&&overlap(r,cr)){ob.hit=true;lives--;livesEl.textContent=lives;hitEffect();ob.el.style.opacity=.25;if(lives<=0){endGame();return}}if(ob.y>bottom+120){if(!ob.hit){score++;scoreEl.textContent=score;if(score%8===0){speed=Math.min(8.2,speed+.35);spawnEvery=Math.max(650,spawnEvery-45)}}ob.el.remove();obstacles.splice(i,1)}}}
function loop(ts){if(!running)return;animateDashes();if(ts-lastSpawn>spawnEvery){spawnObstacle();lastSpawn=ts}updateObstacles();raf=requestAnimationFrame(loop)}
function startGame(){obstacles.forEach(o=>o.el.remove());obstacles=[];score=0;lives=3;speed=4.2;spawnEvery=1050;lane=1;lastSpawn=0;scoreEl.textContent=score;livesEl.textContent=lives;overlay.style.display='none';running=true;makeDashes();updateCar();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function endGame(){running=false;cancelAnimationFrame(raf);card.innerHTML=`<h1>🏁 Partie terminée</h1><p>Score : <strong>${score}</strong></p><button class="bigBtn" id="againBtn">🔁 Rejouer</button><div class="smallText">Utilise les flèches gauche et droite pour éviter les personnages.</div>`;overlay.style.display='flex';document.getElementById('againBtn').onclick=startGame}
startBtn.onclick=startGame;window.addEventListener('resize',()=>{makeDashes();updateCar()});setTimeout(()=>{makeDashes();updateCar()},100);
</script>
</body>
</html>
